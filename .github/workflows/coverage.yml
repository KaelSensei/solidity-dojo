name: Coverage

on:
  push:
    branches:
      - main
      - fix/**
      - feature/**
      - ci/**
  pull_request:
    branches:
      - main

jobs:
  coverage:
    name: "Forge Coverage → Codecov"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Install Forge dependencies
        run: forge install

      - name: Generate coverage report (lcov)
        run: forge coverage --report lcov 2>&1 | tee coverage-summary.txt
        # lcov.info is written to the working directory by forge

      - name: Verify lcov.info was generated
        run: |
          if [ ! -f lcov.info ]; then
            echo "ERROR: lcov.info not found — forge coverage may have failed"
            cat coverage-summary.txt
            exit 1
          fi
          echo "lcov.info found ($(wc -l < lcov.info) lines)"

      - name: Remove test and lib files from coverage
        run: |
          lcov \
            --remove lcov.info \
            '*/test/*' '*/lib/*' \
            --output-file lcov.info \
            --ignore-errors unused,empty \
            || true  # lcov exits non-zero if nothing was removed; that's fine

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: foundry
          name: solidity-dojo
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 1
